# Cloudflare Worker (Static Assets + handler) configuration.
#
# The wallet PWA (Vite + vite-plugin-pwa) is served at
# https://lab.fikua.com/wallet/*. The Worker function in
# src/worker/index.ts strips the /wallet prefix and forwards OID4VC /
# .well-known / oid4vp paths to the lab backend at
# https://lab-backend.fikua.com (Cloudflare Tunnel + Access Service
# Auth). See ADR 0008r1 (v4).

name = "fikua-lab-wallet"
main = "src/worker/index.ts"
compatibility_date = "2026-05-22"

routes = [
    { pattern = "lab.fikua.com/wallet", custom_domain = false, zone_name = "fikua.com" },
    { pattern = "lab.fikua.com/wallet/*", custom_domain = false, zone_name = "fikua.com" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA fallback: any unknown asset returns index.html so the client-side
# router and the vite-plugin-pwa service worker keep their navigation
# consistent.
not_found_handling = "single-page-application"

# Backend reach (see ADR 0008r1):
#   LAB_BACKEND_ORIGIN     — plain var, the hostname Workers fetch().
#   CF_ACCESS_CLIENT_ID    — secret (wrangler secret put).
#   CF_ACCESS_CLIENT_SECRET — secret (wrangler secret put).
[vars]
LAB_BACKEND_ORIGIN = "https://lab-backend.fikua.com"
