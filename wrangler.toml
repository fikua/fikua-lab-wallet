# Cloudflare Workers (Static Assets) configuration.
# This project is the only lab frontend with a build step (Vite + PWA);
# the Workers project must run `npm ci && npm run build` and publish the
# `dist/` directory.

name = "fikua-lab-wallet"
compatibility_date = "2026-05-22"

[assets]
directory = "./dist"
# SPA: any unknown route falls back to index.html (vite-plugin-pwa
# also uses this as navigateFallback so the service worker keeps the
# routing consistent).
not_found_handling = "single-page-application"
