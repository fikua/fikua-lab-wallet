sonar.projectKey=fikua_fikua-lab-wallet
sonar.organization=fikua

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=src/**/*.test.ts,src/test/**,src/worker/**,coverage/**,dist/**

# Generated by `vitest run --coverage` (vitest.config.ts's coverage.reporter
# includes 'lcov') in the SonarQube CI job, before the scan runs — without
# this, SonarCloud reports 0% coverage for every push regardless of actual
# test coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
